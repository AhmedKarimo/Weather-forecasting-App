apiVersion: apps/v1
kind: Deployment
metadata:
  name: neutweather-app
  namespace: neutweather
spec:
  replicas: 2
  selector:
    matchLabels:
      app: neutweather-app

  template:
    metadata:
      labels:
        app: neutweather-app

    spec:
      containers:
        - name: neutweather-app
          image: lordneutroon/weather-app:latest
          imagePullPolicy: Always

          ports:
            - containerPort: 8000
              name: http

          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: neutweather-config
                  key: POSTGRES_DB

            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: neutweather-config
                  key: POSTGRES_USER

            - name: POSTGRES_HOST
              valueFrom:
                configMapKeyRef:
                  name: neutweather-config
                  key: POSTGRES_HOST

            - name: POSTGRES_PORT
              valueFrom:
                configMapKeyRef:
                  name: neutweather-config
                  key: POSTGRES_PORT

            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: neutweather-secrets
                  key: POSTGRES_PASSWORD

            - name: DATABASE_URL
              value: "postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@$(POSTGRES_HOST):$(POSTGRES_PORT)/$(POSTGRES_DB)"

            - name: RAPIDAPI_KEY
              valueFrom:
                secretKeyRef:
                  name: neutweather-secrets
                  key: RAPIDAPI_KEY

            - name: RAPIDAPI_HOST
              valueFrom:
                configMapKeyRef:
                  name: neutweather-config
                  key: RAPIDAPI_HOST

            - name: REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: neutweather-config
                  key: REDIS_URL

            - name: REDIS_CACHE_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: neutweather-config
                  key: REDIS_CACHE_ENABLED

            - name: REDIS_KEY_PREFIX
              valueFrom:
                configMapKeyRef:
                  name: neutweather-config
                  key: REDIS_KEY_PREFIX

            - name: WEATHER_CACHE_TTL_SECONDS
              valueFrom:
                configMapKeyRef:
                  name: neutweather-config
                  key: WEATHER_CACHE_TTL_SECONDS

            - name: WEATHER_COORDINATE_CACHE_TTL_SECONDS
              valueFrom:
                configMapKeyRef:
                  name: neutweather-config
                  key: WEATHER_COORDINATE_CACHE_TTL_SECONDS

          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 20